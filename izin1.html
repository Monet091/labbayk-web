<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Utama Pemilihan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'olive': '#7A846E',
            'cream': '#E3E7C9',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white">

  <!-- Main Container -->
  <div class="w-full bg-white flex flex-col min-h-screen">

    <!-- Header -->
    <div class="bg-[#7A846E] flex items-center px-4 py-4 gap-3">
      <!-- Back Arrow -->
      <button class="text-white flex items-center justify-center" aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <!-- Title -->
      <span class="text-white font-bold text-lg tracking-wide">Pengajuan Izin</span>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col justify-center px-6 py-8 gap-5 pb-24">

      <!-- Tombol 1: Ajukan Izin -->
      <button
        class="w-full bg-[#E3E7C9] rounded-2xl flex items-center gap-4 px-5 py-5 shadow-sm hover:brightness-95 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
        aria-label="Ajukan Izin"
      >
        <!-- Icon Box -->
        <div class="flex-shrink-0 w-14 h-14 border-2 border-[#7A846E] rounded-xl flex items-center justify-center">
          <!-- Document / Form Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-600" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0121 9.414V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <!-- Label -->
        <span class="text-gray-700 font-bold text-base">Ajukan Izin</span>
      </button>

      <!-- Tombol 2: Update -->
      <button
        class="w-full bg-[#E3E7C9] rounded-2xl flex items-center gap-4 px-5 py-5 shadow-sm hover:brightness-95 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
        aria-label="Update"
      >
        <!-- Icon Box -->
        <div class="flex-shrink-0 w-14 h-14 border-2 border-[#7A846E] rounded-xl flex items-center justify-center">
          <!-- Clock / History Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-600" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <!-- Label -->
        <span class="text-gray-700 font-bold text-base">Update</span>
      </button>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex items-center justify-around px-2 py-2 z-50">

      <!-- Home -->
      <button class="flex flex-col items-center gap-0.5 text-[#7A846E] focus:outline-none" aria-label="Home">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="text-[10px] font-medium text-gray-500">Home</span>
      </button>

      <!-- Kalender -->
      <button class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-[#7A846E] focus:outline-none transition-colors" aria-label="Kalender">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="text-[10px] font-medium text-gray-500">Kalender</span>
      </button>

      <!-- Grafik -->
      <button class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-[#7A846E] focus:outline-none transition-colors" aria-label="Grafik">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span class="text-[10px] font-medium text-gray-500">Grafik</span>
      </button>

      <!-- Pengaturan -->
      <button class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-[#7A846E] focus:outline-none transition-colors" aria-label="Pengaturan">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="text-[10px] font-medium text-gray-500">Pengaturan</span>
      </button>

      <!-- Profil -->
      <button class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-[#7A846E] focus:outline-none transition-colors" aria-label="Profil">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="text-[10px] font-medium text-gray-500">Profil</span>
      </button>

    </nav>

  </div>

</body>
</html>

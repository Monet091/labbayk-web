<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi PT. Labbayk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    .fade-transition { transition: opacity 0.25s ease-in-out; }
  </style>
</head>
<body class="bg-[#1e1e1e] min-h-screen w-full flex items-center justify-center p-4">

  <div class="w-full max-w-[360px] h-[640px] bg-[#b3b7aa] rounded-[32px] shadow-2xl overflow-hidden flex flex-col relative border border-white/5">
    
    <div id="modalError" class="absolute inset-x-4 top-[180px] bg-[#dae0ca] border border-[#cbd2ba] p-5 rounded-2xl shadow-[0_12px_30px_-5px_rgba(0,0,0,0.3)] z-50 text-left hidden opacity-0 scale-95 pointer-events-none transition-all duration-200">
      <button id="btnCloseError" class="absolute top-2 right-2 bg-[#8b9181]/30 hover:bg-[#8b9181]/50 text-black font-black text-sm px-2.5 py-1 rounded-md transition-colors">
        X
      </button>
      <div class="text-black pr-6">
        <h3 id="judulError" class="font-extrabold text-base tracking-wide uppercase mb-1">ERROR!!!</h3>
        <p id="teksError" class="font-semibold text-sm leading-snug">
          Silahkan lakukan<br>absensi masuk!
        </p>
      </div>
    </div>

    <div id="modalSukses" class="absolute top-[120px] left-1/2 -translate-x-1/2 w-[300px] bg-[#dae0ca] border border-[#cbd2ba] py-5 px-4 rounded-2xl shadow-[0_12px_30px_-5px_rgba(0,0,0,0.25)] z-50 text-center hidden opacity-0 scale-95 pointer-events-none transition-all duration-200">
      <p id="teksSukses" class="text-black font-extrabold text-[14px] leading-snug tracking-wide uppercase"></p>
    </div>

    <div class="bg-white px-6 py-5 flex items-center gap-5 shadow-sm z-30">
      <button id="btnBack" class="text-gray-700 hover:scale-110 active:scale-95 transition-transform" title="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
      </button>
      <h2 id="judulHeader" class="text-xl font-black tracking-wider text-black uppercase">ABSENSI</h2>
    </div>

    <div class="flex-1 w-full relative">

      <div id="layerPilihanMenu" class="absolute inset-0 flex flex-col justify-center items-center px-6 gap-8 z-20 fade-transition opacity-100">
        <button onclick="pilihMode('Masuk')" class="w-full bg-[#f1f3f9] hover:bg-[#e4e7f0] text-black font-semibold text-sm tracking-widest py-8 px-4 rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] active:scale-98 transition-all uppercase">
          Absensi Masuk
        </button>
        <button onclick="pilihMode('Keluar')" class="w-full bg-[#f1f3f9] hover:bg-[#e4e7f0] text-black font-semibold text-sm tracking-widest py-8 px-4 rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] active:scale-98 transition-all uppercase">
          Absensi Keluar
        </button>
      </div>

      <div id="layerKameraKerja" class="absolute inset-0 flex flex-col items-center justify-start pt-6 px-6 z-10 fade-transition opacity-0 pointer-events-none">
        
        <div class="relative w-full aspect-[3/4] bg-black rounded-2xl overflow-hidden shadow-lg border border-black/10 flex-shrink-0">
          <video id="videoKamera" autoplay playsinline class="w-full h-full object-cover transition-opacity duration-200"></video>
          <img id="fotoPreview" class="absolute inset-0 w-full h-full object-cover hidden opacity-0 transition-opacity duration-200" alt="Hasil jepretan">

          <div id="loadingKamera" class="absolute inset-0 flex flex-col items-center justify-center bg-black text-white gap-3 z-20 transition-opacity duration-200">
            <div id="spinner" class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <span id="loadingText" class="text-xs font-medium tracking-wide text-gray-400">Mengaktifkan Kamera...</span>
          </div>

          <div id="badgeWaktu" class="absolute bottom-4 right-4 bg-[#8b9181]/80 backdrop-blur-md text-white text-[11px] font-medium px-2.5 py-1.5 rounded-lg text-right leading-normal hidden opacity-0 transition-opacity duration-200 z-10"></div>
        </div>

        <div class="w-full flex-1 flex items-center justify-center py-4 relative">
          
          <button id="btnJepret" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-[#8b9181] hover:bg-[#7a8070] active:scale-90 transition-all shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-7 h-7 text-white">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
          </button>

          <button id="btnKirim" class="w-full hidden opacity-0 scale-90 bg-white text-black font-bold text-xs uppercase py-3.5 rounded-xl shadow-md hover:bg-gray-100 transition-all tracking-wider border border-black/5">
            KIRIM
          </button>
          
        </div>
      </div>

    </div>

    <div id="navigasiBawahUtama" class="px-4 w-full z-30 pb-4 fade-transition opacity-100 block">
      <div class="bg-white rounded-2xl py-2 px-4 shadow-sm flex justify-between items-center text-[#8b9181]">
        <button class="p-2 hover:bg-gray-100 rounded-xl transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></button>
        <button class="p-2 bg-[#b3b7aa]/20 text-black rounded-xl transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></button>
        <button class="p-2 hover:bg-gray-100 rounded-xl transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6 h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"/></svg></button>
        <button class="p-2 hover:bg-gray-100 rounded-xl transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></button>
        <button class="p-2 hover:bg-gray-100 rounded-xl transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></button>
      </div>
    </div>

  </div>

  <canvas id="canvasMekanik" class="hidden"></canvas>

  <script>
    const video = document.getElementById('videoKamera');
    const fotoPreview = document.getElementById('fotoPreview');
    const loadingKamera = document.getElementById('loadingKamera');
    const loadingText = document.getElementById('loadingText');
    const spinner = document.getElementById('spinner');
    const badgeWaktu = document.getElementById('badgeWaktu');
    const modalSukses = document.getElementById('modalSukses');
    const teksSukses = document.getElementById('teksSukses');
    
    const modalError = document.getElementById('modalError');
    const judulError = document.getElementById('judulError');
    const teksError = document.getElementById('teksError');
    
    const judulHeader = document.getElementById('judulHeader');
    const btnJepret = document.getElementById('btnJepret');
    const btnKirim = document.getElementById('btnKirim');
    const btnBack = document.getElementById('btnBack');
    const btnCloseError = document.getElementById('btnCloseError');
    
    const layerPilihanMenu = document.getElementById('layerPilihanMenu');
    const layerKameraKerja = document.getElementById('layerKameraKerja');
    const navigasiBawahUtama = document.getElementById('navigasiBawahUtama');
    const canvas = document.getElementById('canvasMekanik');

    let streamKamera = null;
    let currentStep = 1; 
    let modeTerpilih = ""; 
    
    let sudahAbsenMasuk = false; 
    let sudahAbsenKeluar = false; 

    async function jalankanKamera() {
      loadingKamera.classList.remove('hidden', 'opacity-0');
      spinner.classList.remove('hidden');
      loadingText.innerText = "Mengaktifkan Kamera...";
      
      try {
        streamKamera = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = streamKamera;
        loadingKamera.classList.add('opacity-0');
        setTimeout(() => loadingKamera.classList.add('hidden'), 250);
      } catch (err) {
        console.error(err);
        loadingKamera.innerHTML = "<span class='text-red-400 text-xs font-bold text-center px-4'>Gagal Membuka Kamera.</span>";
      }
    }

    function matikanKamera() {
      if (streamKamera) {
        streamKamera.getTracks().forEach(track => track.stop());
        streamKamera = null;
        video.srcObject = null;
      }
    }

    function bukaModalPeringatan(judul, pesan) {
      judulError.innerText = judul;
      teksError.innerHTML = pesan;
      modalError.classList.remove('hidden');
      setTimeout(() => {
        modalError.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
        modalError.classList.add('opacity-100', 'scale-100');
      }, 30);
    }

    function pilihMode(mode) {
      if (mode === 'Masuk' && sudahAbsenMasuk) {
        bukaModalPeringatan("PERINGATAN", "Anda sudah melakukan<br>absensi masuk hari ini!");
        return;
      }
      
      if (mode === 'Keluar') {
        if (!sudahAbsenMasuk) {
          bukaModalPeringatan("ERROR!!!", "Silahkan lakukan<br>absensi masuk!");
          return;
        }
        if (sudahAbsenKeluar) {
          bukaModalPeringatan("PERINGATAN", "Anda sudah melakukan<br>absensi keluar hari ini!");
          return;
        }
      }

      modeTerpilih = mode;
      judulHeader.innerText = `ABSEN ${mode.toUpperCase()}`;

      layerPilihanMenu.classList.add('opacity-0', 'pointer-events-none');
      navigasiBawahUtama.classList.add('opacity-0', 'pointer-events-none');
      
      setTimeout(() => {
        navigasiBawahUtama.classList.add('hidden');
        
        layerKameraKerja.classList.remove('pointer-events-none');
        layerKameraKerja.classList.add('opacity-100', 'z-20');
        layerPilihanMenu.classList.remove('z-20');
        layerPilihanMenu.classList.add('z-10');
      }, 200);

      jalankanKamera();
      currentStep = 2;
    }

    function dapatkanWaktuSekarang() {
      const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const sekarang = new Date();
      const namaHari = hari[sekarang.getDay()];
      const tanggal = String(sekarang.getDate()).padStart(2, '0');
      const bulan = String(sekarang.getMonth() + 1).padStart(2, '0');
      const tahun = String(sekarang.getFullYear()).slice(-2);
      
      let jam = sekarang.getHours();
      const menit = String(sekarang.getMinutes()).padStart(2, '0');
      const ampm = jam >= 12 ? 'PM' : 'AM';
      jam = jam % 12;
      jam = jam ? jam : 12;
      const jamStr = String(jam).padStart(2, '0');

      return `${namaHari}, ${tanggal}-${bulan}-${tahun}<br>${jamStr}:${menit} ${ampm}`;
    }

    btnJepret.addEventListener('click', () => {
      if (!streamKamera) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      
      fotoPreview.src = canvas.toDataURL('image/png');
      fotoPreview.classList.remove('hidden');
      
      setTimeout(() => {
        fotoPreview.classList.add('opacity-100');
        video.classList.add('opacity-0');
      }, 30);

      badgeWaktu.innerHTML = dapatkanWaktuSekarang();
      badgeWaktu.classList.remove('hidden');
      setTimeout(() => badgeWaktu.classList.add('opacity-100'), 50);

      btnJepret.classList.add('hidden');
      btnKirim.classList.remove('hidden');
      setTimeout(() => {
        btnKirim.classList.remove('opacity-0', 'scale-90');
        btnKirim.classList.add('opacity-100', 'scale-100');
      }, 30);

      currentStep = 3;
    });

    btnKirim.addEventListener('click', () => {
      if (currentStep !== 3) return;
      
      teksSukses.innerHTML = `ABSEN ${modeTerpilih.toUpperCase()}<br>BERHASIL!`;
      modalSukses.classList.remove('hidden');
      
      setTimeout(() => {
        modalSukses.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
        modalSukses.classList.add('opacity-100', 'scale-100');
      }, 30);
      
      if (modeTerpilih === 'Masuk') {
        sudahAbsenMasuk = true;
      } else if (modeTerpilih === 'Keluar') {
        sudahAbsenKeluar = true;
      }

      matikanKamera();
      currentStep = 4;
    });

    btnBack.addEventListener('click', () => {
      modalSukses.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
      modalError.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
      
      setTimeout(() => {
        modalSukses.classList.add('hidden');
        modalError.classList.add('hidden');
      }, 200);
      
      fotoPreview.classList.remove('opacity-100');
      fotoPreview.classList.add('hidden');
      video.classList.remove('opacity-0');
      badgeWaktu.classList.add('hidden', 'opacity-0');

      // Kembalikan tombol jepret semula dan buang tombol kirim
      btnJepret.classList.remove('hidden');
      btnKirim.classList.add('hidden', 'opacity-0');
      btnKirim.classList.remove('scale-100', 'opacity-100');
      
      layerKameraKerja.classList.remove('opacity-100', 'z-20');
      layerKameraKerja.classList.add('opacity-0', 'pointer-events-none', 'z-10');

      setTimeout(() => {
        layerPilihanMenu.classList.remove('opacity-0', 'pointer-events-none', 'z-10');
        layerPilihanMenu.classList.add('opacity-100', 'z-20');
        
        navigasiBawahUtama.classList.remove('hidden');
        setTimeout(() => {
          navigasiBawahUtama.classList.remove('opacity-0', 'pointer-events-none');
        }, 30);
      }, 200);

      judulHeader.innerText = "ABSENSI";
      matikanKamera();
      currentStep = 1;
    });

    btnCloseError.addEventListener('click', () => {
      modalError.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
      setTimeout(() => modalError.classList.add('hidden'), 200);
    });
  </script>
</body>
</html>

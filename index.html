<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - PT. Labbayk Haramain Travel</title>
    <style>
        .bg-custom {
            /* Pastikan file gambar berada di folder yang sama */
            background-image: url('background.jpg'); 
            background-position: center;
            background-repeat: repeat;
            background-size: 200px;
            background-size: auto; 
        }
    </style>
</head>
<body class="bg-custom min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#8e937d] w-full max-w-sm rounded-[40px] p-8 shadow-2xl flex flex-col items-center">
        
        <div class="mb-8 text-center text-white">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-2 overflow-hidden shadow-lg">
                 <img src="logo.jpg" alt="Logo Labbayk" class="w-full h-full object-contain"> 
            </div>
            <h2 class="font-serif text-lg tracking-widest uppercase">Labbayk</h2>
            <p class="text-[10px] tracking-[0.2em] uppercase">Tour & Travel</p>
        </div>

        <div class="bg-white w-full rounded-[25px] p-8 shadow-inner">
            <h1 class="text-xl font-bold mb-6 text-black">LOGIN</h1>

            <form action="beranda.html" method="POST">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-black mb-1" for="username">User ID</label>
                    <input class="w-full bg-[#d9d9d9] border-none p-2 rounded focus:ring-2 focus:ring-[#8e937d] outline-none" 
                           type="text" id="username" name="username" required>
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-bold text-black mb-1" for="password">Password</label>
                    <input class="w-full bg-[#d9d9d9] border-none p-2 rounded focus:ring-2 focus:ring-[#8e937d] outline-none" 
                           type="password" id="password" name="password" required>
                </div>

                <div class="flex justify-end">
                    <button type="submit" 
                            class="bg-[#d9d9d9] hover:bg-gray-300 text-black font-bold py-1 px-6 rounded border border-gray-400 shadow-sm">
                        LOGIN
                    </button>
                </div>
            </form>
        </div>
        
    </div>

</body>
</html>

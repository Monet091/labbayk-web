<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Labbayk HRIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-700 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <span class="text-white text-2xl font-bold">L</span>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Labbayk HRIS</h1>
            <p class="text-sm text-gray-500">Portal Karyawan</p>
        </div>

        <!-- Form -->
        <form id="loginForm" novalidate>
            <!-- NIK -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">NIK Karyawan</label>
                <input type="text" id="nik" placeholder="Contoh: LBK001"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm
                           focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                           transition duration-200" required>
                <p id="nikError" class="text-red-500 text-xs mt-1 hidden">NIK tidak boleh kosong.</p>
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="Masukkan password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm
                               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                               transition duration-200 pr-10" required>
                    <button type="button" id="togglePass"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        👁
                    </button>
                </div>
                <p id="passError" class="text-red-500 text-xs mt-1 hidden">Password tidak boleh kosong.</p>
            </div>

            <!-- Pesan error login -->
            <div id="loginError" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm
                                         rounded-lg px-4 py-3 mb-4 text-center">
                NIK atau password salah.
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3
                       rounded-lg transition duration-200 active:scale-95">
                Masuk
            </button>
        </form>
    </div>

    <script>
        // Toggle show/hide password
        document.getElementById('togglePass').addEventListener('click', () => {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        // Form submission (dummy auth untuk Sprint 1)
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nik = document.getElementById('nik').value.trim();
            const pass = document.getElementById('password').value.trim();
            let valid = true;

            // Validasi kosong
            document.getElementById('nikError').classList.toggle('hidden', nik !== '');
            document.getElementById('passError').classList.toggle('hidden', pass !== '');
            if (!nik || !pass) return;

            // Dummy auth — Sprint 1: hardcode, Sprint 2: ganti ke fetch API
            const dummyUsers = [
                { nik: 'LBK001', password: 'password123', role: 'karyawan' },
                { nik: 'ADM001', password: 'password123', role: 'hrd' },
            ];

            const user = dummyUsers.find(u => u.nik === nik && u.password === pass);

            if (user) {
                // Simpan sesi sementara
                sessionStorage.setItem('userNIK', user.nik);
                sessionStorage.setItem('userRole', user.role);
                // Redirect ke beranda
                window.location.href = 'beranda.html';
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        // Redirect jika sudah login
        if (sessionStorage.getItem('userNIK')) {
            window.location.href = 'beranda.html';
        }
    </script>
</body>
</html>

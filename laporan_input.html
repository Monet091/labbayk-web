<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Input Laporan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'olive': '#7A846E',
          }
        }
      }
    }
  </script>
  <style>
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      right: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen bg-[#a9af9e]">

  <div class="w-full bg-white min-h-screen flex flex-col">

    <!-- HEADER BACK KE LAPORAN.HTML -->
    <div class="bg-white flex items-center px-6 py-4 shadow-md shrink-0 gap-3">
      <button onclick="window.location.href='laporan.html'" class="text-gray-600 hover:text-gray-900 transition-colors mr-1 flex items-center justify-center" aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" fill="none" 
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <span class="text-gray-900 font-bold text-lg md:text-xl tracking-wider uppercase">Input Laporan</span>
    </div>

    <!-- FORM BODY -->
    <div class="px-5 py-5 max-w-xl mx-auto w-full flex-1">

      <h1 class="text-center text-base font-bold uppercase tracking-widest mb-5 text-gray-800">
        Formulir Pekerjaan
      </h1>

      <form onsubmit="event.preventDefault(); alert('Laporan berhasil disimpan!');">

        <!-- NIK -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">NIK :</label>
          <input
            type="text"
            required
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          />
        </div>

        <!-- TANGGAL -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Tanggal :</label>
          <div class="relative">
            <input
              type="date"
              required
              class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] pr-10"
            />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </span>
          </div>
        </div>

        <!-- DESKRIPSI PEKERJAAN -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Deskripsi Pekerjaan :</label>
          <textarea
            rows="5"
            required
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] resize-none"
          ></textarea>
        </div>

        <!-- LAMPIRKAN FILE -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-800 mb-1">Lampirkan File :</label>
          <label class="max-w-[120px] bg-gray-200 rounded px-3 py-2 text-sm text-gray-600 flex items-center justify-center cursor-pointer hover:bg-gray-300 transition-colors shadow-sm">
            <i data-lucide="paperclip" class="w-5 h-5 text-gray-700 transform rotate-45"></i>
            <input type="file" id="fileInput" class="hidden" onchange="updateFileName()" />
          </label>
          <p id="fileNameDisplay" class="text-xs text-gray-500 mt-2 italic font-semibold"></p>
        </div>

        <!-- TOMBOL SIMPAN -->
        <div class="flex justify-end">
          <button
            type="submit"
            class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-sm uppercase px-6 py-2 rounded shadow transition-all focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          >
            Simpan
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Fungsi handle lampiran file berjalan dinamis
    function updateFileName() {
      const input = document.getElementById('fileInput');
      const display = document.getElementById('fileNameDisplay');
      if (input.files.length > 0) {
        display.innerText = "📎 File siap dikirim: " + input.files[0].name;
      } else {
        display.innerText = "";
      }
    }
  </script>
</body>
</html>

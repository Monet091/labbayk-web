<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Laporan - PT. Labbayk Haramain Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'olive': '#7A846E',
          }
        }
      }
    }
  </script>
  <style>
    /* Menyembunyikan icon kalender bawaan browser agar lebih rapi */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      right: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    body { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-white flex flex-col">

  <div class="w-full flex flex-col flex-grow">

    <!-- HEADER: Warna hijau sesuai desain -->
    <div class="bg-[#a4ad9f] flex items-center px-6 py-4 shadow-md shrink-0 gap-3">
      <!-- Tombol kembali (bisa lu sesuaikan href-nya kalau mau balik ke menu utama) -->
      <button onclick="window.location.href='laporan.html'" class="text-white hover:text-gray-200 transition-colors mr-1 flex items-center justify-center" aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" fill="none" 
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <span class="text-white font-bold text-lg md:text-xl tracking-wider capitalize">Laporan</span>
    </div>

    <!-- FORM BODY: Konten menyatu langsung ke latar layar -->
    <div class="px-5 py-5 max-w-xl mx-auto w-full flex-1 mt-4">

      <!-- Form Action mengarah ke file PHP untuk memproses database -->
      <form action="simpan_laporan.php" method="POST" enctype="multipart/form-data">

        <!-- NIK -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">NIK :</label>
          <input
            type="text"
            name="nik"
            required
            class="w-full bg-[#e5e7eb] rounded-none px-3 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          />
        </div>

        <!-- TANGGAL -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Tanggal :</label>
          <div class="relative">
            <input
              type="date"
              name="tanggal"
              required
              class="w-full bg-[#e5e7eb] rounded-none px-3 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] pr-10"
            />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </span>
          </div>
        </div>

        <!-- DESKRIPSI PEKERJAAN -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Deskripsi Pekerjaan :</label>
          <textarea
            name="deskripsi_pekerjaan"
            rows="5"
            required
            class="w-full bg-[#e5e7eb] rounded-none px-3 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] resize-none"
          ></textarea>
        </div>

        <!-- LAMPIRKAN FILE -->
        <div class="mb-8">
          <label class="block text-sm font-medium text-gray-800 mb-1">Lampirkan File :</label>
          <label class="w-[80px] h-[40px] bg-[#e5e7eb] flex items-center justify-center cursor-pointer hover:bg-gray-300 transition-colors">
            <i data-lucide="paperclip" class="w-5 h-5 text-gray-700 transform rotate-45"></i>
            <input type="file" name="file_laporan" id="fileInput" class="hidden" onchange="updateFileName()" />
          </label>
          <p id="fileNameDisplay" class="text-xs text-gray-500 mt-2 italic font-semibold"></p>
        </div>

        <!-- TOMBOL SIMPAN -->
        <div class="flex justify-end mt-4">
          <button
            type="submit"
            class="bg-[#e5e7eb] hover:bg-gray-300 text-gray-800 font-semibold text-sm px-6 py-2 shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          >
            SIMPAN
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    // Memuat icon dari Lucide
    lucide.createIcons();

    // Fungsi handle tulisan nama file setelah dipilih
    function updateFileName() {
      const input = document.getElementById('fileInput');
      const display = document.getElementById('fileNameDisplay');
      if (input.files.length > 0) {
        display.innerText = "📎 File siap dikirim: " + input.files[0].name;
      } else {
        display.innerText = "";
      }
    }
  </script>
</body>
</html>

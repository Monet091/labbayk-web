<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Pengajuan Izin/Cuti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'olive': '#7A846E',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom date input styling to hide default browser icon */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      right: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen bg-[#a9af9e]">

  <div class="w-full bg-white">

    <div class="bg-white flex items-center px-6 py-4 shadow-md shrink-0 gap-3">
      <button onclick="window.location.href='izin_pilihan.html'" class="text-gray-600 hover:text-gray-900 transition-colors mr-1 flex items-center justify-center" aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" fill="none" 
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <span class="text-gray-900 font-bold text-lg md:text-xl tracking-wider uppercase">Ajukan Izin</span>
    </div>

    <div class="px-5 py-5 max-w-xl mx-auto">

      <h1 class="text-center text-base font-bold uppercase tracking-widest mb-5 text-gray-800">
        Formulir Cuti
      </h1>

      <form>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Tanggal izin :</label>
          <div class="relative">
            <input
              type="date"
              class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] pr-10"
            />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </span>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Tanggal selesai :</label>
          <div class="relative">
            <input
              type="date"
              class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] pr-10"
            />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </span>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Nama Karyawan :</label>
          <input
            type="text"
            placeholder=""
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">NIP :</label>
          <input
            type="text"
            placeholder=""
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">ID Tipe Izin :</label>
          <input
            type="text"
            placeholder=""
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">ID Izin :</label>
          <input
            type="text"
            placeholder=""
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-800 mb-1">Alasan :</label>
          <textarea
            rows="5"
            class="w-full bg-gray-200 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#7A846E] resize-none"
          ></textarea>
        </div>

        <!-- LAMPIRKAN FILE -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-800 mb-1">Lampirkan File :</label>
          <label class="max-w-[120px] bg-gray-200 rounded px-3 py-2 text-sm text-gray-600 flex items-center justify-center cursor-pointer hover:bg-gray-300 transition-colors shadow-sm">
            <i data-lucide="paperclip" class="w-5 h-5 text-gray-700 transform rotate-45"></i>
            <input type="file" id="fileInput" class="hidden" onchange="updateFileName()" />
          </label>
          <p id="fileNameDisplay" class="text-xs text-gray-500 mt-2 italic font-semibold"></p>
        </div>

          <script src="https://unpkg.com/lucide@latest"></script>
          <script>
            lucide.createIcons();
          </script>

        <div class="flex justify-end">
          <button
            type="submit"
            class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold text-sm uppercase px-5 py-2 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-[#7A846E]"
          >
            Kirim
          </button>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
